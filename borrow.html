<!DOCTYPE html>
<html>
<head>
  <title>Borrow Book</title>
</head>
<body>
  <h2>Borrow Book</h2>

  <form action="process_borrow.php" method="POST">
    <label>Member Name:</label>
    <input type="text" name="member" required><br><br>

    <label>Book Title:</label>
    <input type="text" name="book" required><br><br>

    <label>Borrow Date:</label>
    <input type="date" name="borrow_date" id="borrowDate" readonly><br><br>

    <label>Due Date:</label>
    <input type="date" name="due_date" id="dueDate" readonly><br><br>

    <button type="submit">Borrow</button>
  </form>

  <script src="borrow.js"></script>
</body>
</html>
